version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: document-processor-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - document-processor-network
    restart: unless-stopped

  demo-web:
    image: nginx:1.27-alpine
    container_name: document-processor-demo-web
    depends_on:
      - api
    ports:
      - "8081:80"
    volumes:
      - ../demo:/usr/share/nginx/html:ro
    networks:
      - document-processor-network
    restart: unless-stopped
    profiles:
      - demo

  redis:
    image: redis:7-alpine
    container_name: document-processor-redis
    ports:
      - "6379:6379"
    networks:
      - document-processor-network
    restart: unless-stopped

networks:
  document-processor-network:
    driver: bridge
